<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MultiCule">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0b1a" media="(prefers-color-scheme: dark)">
<title>MultiCule</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#000;--l2:rgba(60,60,67,.6);--l3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.16);--blue:#007aff;--green:#34c759;--yel:#ffcc00;--yelt:#8a6500;--red:#ff3b30;--fill:rgba(120,120,128,.12);--bar:rgba(249,249,249,.9);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d0b1a;--card:#1b1833;--label:#fff;--l2:rgba(226,222,255,.68);--l3:rgba(226,222,255,.34);--sep:rgba(150,140,255,.2);--blue:#8b6cff;--green:#2cf27a;--yel:#ffe14d;--yelt:#ffe14d;--red:#ff5c7a;--fill:rgba(150,140,255,.18);--bar:rgba(18,15,38,.92)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#hdr{flex:none;padding:calc(env(safe-area-inset-top) + 8px) 16px 4px}
.hr{display:flex;align-items:center;justify-content:space-between;min-height:36px}
h1.t{font-size:34px;line-height:1.1;margin:8px 0 2px;font-weight:700}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 0 calc(96px + env(safe-area-inset-bottom))}
#tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(env(safe-area-inset-bottom) + 2px)}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--l2);position:relative;text-align:center}
#tabbar button.on{color:var(--blue)}
.badge{position:absolute;top:-3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
svg.i{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pp{display:flex;align-items:center;gap:6px;background:var(--fill);padding:4px 12px 4px 5px;border-radius:99px;font-size:15px;font-weight:500}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none}
.add{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.add svg{width:20px;height:20px;stroke-width:2.4}
.group{background:var(--card);border-radius:12px;margin:12px 16px;overflow:hidden}
.group>*{position:relative}
.group>*+*::before{content:'';position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;min-height:48px}
.grow{flex:1;min-width:0}
.row b,.grow>b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{display:block;color:var(--l2);font-size:13px;margin-top:1px}
.ic{width:34px;height:34px;border-radius:8px;background:var(--fill);display:grid;place-items:center;font-size:18px;flex:none}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;flex:none;white-space:nowrap}
.pill.grn{background:rgba(52,199,89,.18);color:var(--green)}
.pill.yel{background:rgba(255,204,0,.25);color:var(--yelt)}
.pill.red{background:rgba(255,59,48,.16);color:var(--red)}
.dot{display:block;width:8px;height:8px;border-radius:50%}
.dot.grn{background:var(--green)}.dot.yel{background:var(--yel)}.dot.red{background:var(--red)}
.chev svg{width:16px;height:16px;stroke:var(--l3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:99px;background:var(--fill);font-size:15px}
.chip.on{background:var(--blue);color:#fff}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:8px 16px}
.seg button{flex:1;text-align:center;padding:6px 4px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.sr input{width:calc(100% - 32px);margin:6px 16px;padding:9px 12px;border-radius:10px;border:0;background:var(--fill);color:var(--label);font:inherit;outline:none}
.fr{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:46px}
.fr>span{flex:none;max-width:45%}
.fr input,.fr select{flex:1;min-width:0;border:0;background:none;color:var(--label);font:inherit;text-align:right;padding:12px 0;outline:none;-webkit-appearance:none;appearance:none;min-height:44px}
.fr.col{flex-direction:column;align-items:stretch;gap:2px;padding:10px 16px}
.fr.col textarea{border:0;background:none;color:var(--label);font:inherit;resize:none;outline:none}
input::placeholder,textarea::placeholder{color:var(--l3)}
.btn{display:block;width:calc(100% - 32px);margin:12px 16px;padding:14px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;text-align:center}
.btn.sec{background:var(--card);color:var(--blue)}
.link{color:var(--blue)}.danger{color:var(--red)}.bold{font-weight:600}.l2{color:var(--l2)}
.mini{background:var(--fill);color:var(--blue);padding:6px 10px;border-radius:99px;font-size:13px;font-weight:600;flex:none;border:0;font-family:inherit}
select.mini{-webkit-appearance:none;appearance:none}
.sec-t{font-size:15px;font-weight:600;color:var(--l2);margin:22px 32px 0}
.cap-note{font-size:13px;color:var(--l2);margin:8px 32px}
.empty{text-align:center;padding:40px 32px;color:var(--l2)}
.empty .e{font-size:46px}.empty h3{color:var(--label);margin:8px 0 4px}.empty p{margin:0}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 16px}
.kv span:first-child{color:var(--l2);flex:none}.kv span:last-child{text-align:right}
.mk{padding:9px 16px}.mk.bad{color:var(--red);font-weight:600}
.sym{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.pv{background:var(--card);min-height:90px;display:grid;place-items:center;margin:12px 16px;border-radius:12px;overflow:hidden}
.pv img{width:100%;max-height:60vh;object-fit:contain;display:block}
.pv iframe{width:100%;height:50vh;border:0;background:#fff}
.nofile{color:var(--l2);padding:28px;font-size:15px}
.sw input{display:none}.sw i{display:block;width:32px;height:32px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--card)}.sw input:checked+i{border-color:var(--label)}
.sws{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px}
/* calendario */
.cal{margin:8px 16px}.calh{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px}
.calh b{font-size:20px;text-transform:capitalize}.calh button{padding:6px 12px;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid .w{font-size:12px;color:var(--l2);padding:4px 0}
.grid button{aspect-ratio:1/1.1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.grid button .n{width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.grid button.td .n{background:var(--blue);color:#fff;font-weight:600}
.grid button.sel{background:var(--fill)}
/* hojas */
.sh{position:fixed;inset:0;z-index:50}
.shbk{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.shp{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 10px);background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.shn{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:.5px solid var(--sep);flex:none}
.shn button{color:var(--blue);min-width:72px}.shn button:last-child{text-align:right}.shn span{min-width:72px}
.shc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.mn{position:fixed;inset:0;z-index:80}
.mnbk{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.mnp{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);animation:up .22s ease-out}
.mng{background:var(--card);border-radius:14px;margin-top:8px;overflow:hidden;max-height:60vh;overflow-y:auto}
.mng button{display:block;width:100%;text-align:center;padding:16px;border-top:.5px solid var(--sep);color:var(--blue)}
.mng button.danger{color:var(--red)}.mng button.on{font-weight:700}
.mnt{padding:12px;text-align:center;color:var(--l2);font-size:13px}
.zm{position:fixed;inset:0;z-index:120;background:#000;overflow:auto}.zm img{width:100%;min-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:rgba(50,50,52,.96);color:#fff;padding:10px 16px;border-radius:99px;font-size:15px;z-index:150;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1}
/* bloqueo */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 24px calc(env(safe-area-inset-bottom) + 16px)}
#lock.on{display:flex}
#lock h2{margin:10px 0 2px;font-size:22px}#lock p{margin:0;color:var(--l2);min-height:20px;font-size:15px;text-align:center}
.lkic{width:64px;height:64px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center}.lkic svg{width:32px;height:32px}
.dots{display:flex;gap:16px;margin:22px 0}.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--l2)}.dots i.f{background:var(--label);border-color:var(--label)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{width:76px;height:76px;border-radius:50%;background:var(--fill);font-size:30px;text-align:center;display:grid;place-items:center}
.pad button.ghost{background:none;font-size:15px;color:var(--blue)}.pad button.ghost svg{width:28px;height:28px;color:var(--label)}
.shake{animation:shk .4s}@keyframes shk{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
body.locked #app,body.locked #sheets{visibility:hidden}
body.cover::after{content:'';position:fixed;inset:0;background:var(--bg);z-index:300}
/* gráficos */
svg.chart text{fill:var(--l2);font-size:10px}svg.chart .g{stroke:var(--sep)}svg.chart .f{stroke:var(--red);stroke-dasharray:4 3;opacity:.7}
svg.chart .ln{stroke:var(--blue);fill:none;stroke-width:2;stroke-linejoin:round}svg.chart circle{fill:var(--blue)}
.fab{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20;text-align:center}
.bub{max-width:85%;padding:9px 13px;border-radius:18px;margin:8px 16px;font-size:16px;line-height:1.35;-webkit-user-select:text;user-select:text}.bub.b{background:var(--card)}.bub.u{background:var(--blue);color:#fff;margin-left:auto;width:fit-content}.bub .group{margin:8px -6px 2px}
/* impresión */
#printroot{display:none}
@media print{body{position:static;overflow:visible;height:auto}html{height:auto}#app,#sheets,#lock,.mn,.toast{display:none!important}#printroot{display:block;color:#000;background:#fff;padding:20px;font:14px/1.45 -apple-system,Helvetica,Arial,sans-serif}#printroot h2{margin:0 0 4px}#printroot table{border-collapse:collapse;width:100%;margin:6px 0 12px}#printroot td,#printroot th{border:1px solid #bbb;padding:5px 8px;text-align:left}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div id="hdr"></div><div id="view"></div><nav id="tabbar"></nav><button class="fab" data-act="cule" aria-label="Cule, tu ayudante">🐍</button></div>
<div id="sheets"></div><div id="lock"></div><div id="toast" class="toast"></div><div id="printroot"></div>
<script>
'use strict';
/* ============ Utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const days=s=>Math.round((parse(s)-parse(today()))/864e5);
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const addM=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return ymd(d)};
const fmt=s=>s?parse(s).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtDT=i=>new Date(i).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const toLocalInput=i=>{const d=i?new Date(i):new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const fromLocalInput=v=>new Date(v).toISOString();
function dur(a,b){const m=Math.max(0,Math.floor((new Date(b)-new Date(a))/6e4));const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;const D=d+(d===1?' día':' días'),H=h+(h===1?' hora':' horas');if(d)return h?`${D} y ${H}`:D;if(h)return mm?`${H} y ${mm} min`:H;return mm+' min'}
const stat=s=>{const d=days(s);return d<=7?'red':d<=30?'yel':'grn'};
const statTxt=s=>{const d=days(s);return d<0?`Vencido hace ${-d} d`:d===0?'Hoy':d===1?'Mañana':`En ${d} d`};
const kv=(l,v,raw)=>`<div class="kv"><span>${l}</span><span>${raw?v:esc(v)}</span></div>`;
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64u=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)};

/* ============ Iconos ============ */
const IC={folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',plus:'<path d="M5 12h14M12 5v14"/>',chev:'<path d="m9 18 6-6-6-6"/>',lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',back:'<path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="m18 9-6 6M12 9l6 6"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;

/* ============ Base de datos (IndexedDB nativo, sin dependencias) ============ */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('navaja-suiza',1);r.onupgradeneeded=()=>{const d=r.result;['profiles','docs','assets','records','tasks','episodes','files'].forEach(n=>d.createObjectStore(n,{keyPath:'id'}));d.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 tx(s,m,fn){return new Promise((res,rej)=>{const t=this.db.transaction(s,m);const q=fn(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 all(s){return this.tx(s,'readonly',o=>o.getAll())},get(s,id){return this.tx(s,'readonly',o=>o.get(id))},
 put(s,v){return this.tx(s,'readwrite',o=>o.put(v))},del(s,id){return this.tx(s,'readwrite',o=>o.delete(id))},clear(s){return this.tx(s,'readwrite',o=>o.clear())}};
const ST=['profiles','docs','assets','records','tasks','episodes'];
const D={};ST.forEach(k=>D[k]=[]);
const loadAll=async()=>{for(const k of ST)D[k]=await DB.all(k)};
const save=async(k,o)=>{await DB.put(k,o);const i=D[k].findIndex(x=>x.id===o.id);i<0?D[k].push(o):D[k][i]=o;return o};
const remove=async(k,id)=>{await DB.del(k,id);D[k]=D[k].filter(x=>x.id!==id)};
const getMeta=async k=>(await DB.get('meta',k))?.v;
const setMeta=(k,v)=>DB.put('meta',{k,v});
const putFile=async b=>{const id=uid();await DB.put('files',{id,type:b.type,buf:await b.arrayBuffer()});return id};
const getBlob=async id=>{const f=id&&await DB.get('files',id);return f?new Blob([f.buf],{type:f.type}):null};

/* ============ Estado ============ */
const S={tab:'docs',profile:'all',sub:{mant:'veh',salud:'epi'},cat:'all',q:'',month:new Date(new Date().getFullYear(),new Date().getMonth(),1),selDay:null};
const COLORS=['#007aff','#ff9500','#34c759','#af52de','#ff2d55','#5ac8fa','#a2845e','#ff3b30'];
const CATS=['Identidad','Conducción','Seguros','Contratos','Facturas','Garantías'];
const CATEMO={Identidad:'🪪',Conducción:'🚗',Seguros:'🛡️',Contratos:'📝',Facturas:'🧾',Garantías:'🔧'};
const HOME=[['Caldera / calefacción','🔥'],['Seguro de vivienda','🏠'],['Suscripción','🔁'],['Otro','🧰']];
const GI={nota:'📝',vehiculo:'🔧',mascota:'💊',vacuna:'💉',peso:'⚖️',visita:'🩺',analitica:'🧪'};
const SYMS=['Fiebre','Dolor de cabeza','Dolor de garganta','Tos','Náuseas','Vómitos','Diarrea','Dolor muscular','Congestión','Mocos','Escalofríos','Cansancio','Dolor abdominal','Erupción'];
const MTYPES={'Aceite y filtros':[12,15000],'Neumáticos':[0,40000],'Frenos':[24,30000],'Batería':[48,0],'Revisión general':[12,15000],'ITV (pasada)':[12,0],'Renovación de seguro':[12,0],'Otro':[0,0]};
const prof=id=>D.profiles.find(p=>p.id===id);
const pname=id=>prof(id)?.name||'—';
const inScope=pid=>S.profile==='all'||pid===S.profile;
const avatar=(p,sz=28)=>`<span class="av" style="background:${p.color};width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.48)}px">${p.type==='pet'?'🐾':esc((p.name[0]||'?').toUpperCase())}</span>`;
let pending={blob:null};

/* ============ Formularios ============ */
const F={
 text:(n,l,v,o={})=>`<label class="fr"><span>${l}</span><input name="${n}" value="${esc(v)}" ${o.req?'required':''} ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.list?`list="${o.list}"`:''} autocomplete="off"></label>`,

function openSheet(o){const el=document.createElement('div');el.className='sh';el.innerHTML='<div class="shbk" data-act="closeSheet"></div><div class="shp"><div class="shn"></div><div class="shc"></div></div>';$('#sheets').append(el);const s={el,o,urls:[]};SH.push(s);paint(s);return s}
function paint(s){const o=s.o;const html=o.render();if(html===null){SH.splice(SH.indexOf(s),1);s.el.remove();return}
 $('.shn',s.el).innerHTML=`<button data-act="closeSheet">${o.left||'Cerrar'}</button><b>${esc(o.title)}</b>${o.right?`<button class="bold" data-act="${o.right.act}" data-id="${o.right.id||''}">${o.right.label}</button>`:'<span></span>'}`;
 const c=$('.shc',s.el),sc=c.scrollTop;c.innerHTML=html;c.scrollTop=sc;o.mount&&o.mount(s)}
function closeSheet(){const s=SH.pop();if(!s)return;s.urls.forEach(u=>URL.revokeObjectURL(u));s.el.remove()}
function refresh(){const sc=$('#view').scrollTop;render();$('#view').scrollTop=sc;[...SH].forEach(s=>{if(s.o.live)paint(s)})}
function menu(title,items){closeMenu();MENU={items};const el=document.createElement('div');el.className='mn';el.innerHTML=`<div class="mnbk" data-act="closeMenu"></div><div class="mnp"><div class="mng">${title?`<div class="mnt">${esc(title)}</div>`:''}${items.map((it,i)=>`<button class="${it.danger?'danger':''} ${it.on?'on':''}" data-mi="${i}">${it.label}</button>`).join('')}</div><div class="mng"><button class="bold" data-act="closeMenu">Cancelar</button></div></div>`;document.body.append(el)}

async function showPreview(s,box,fileId){if(!box)return;if(!fileId){box.innerHTML='<div class="nofile">Sin archivo adjunto</div>';return}
 const b=await getBlob(fileId);if(!b){box.innerHTML='<div class="nofile">Archivo no disponible</div>';return}
 const url=URL.createObjectURL(b);s.urls.push(url);const pdf=b.type==='application/pdf';
 box.innerHTML=pdf?`<iframe src="${url}"></iframe>`:`<img src="${url}" data-act="zoom">`;
 box.insertAdjacentHTML('afterend',`<div class="group"><button class="row link" data-act="shareFile" data-id="${fileId}">${pdf?'Abrir / compartir PDF':'Compartir o guardar imagen'}</button></div>`)}
async function deliver(blob,name){const file=new File([blob],name,{type:blob.type});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==='AbortError')return}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function compress(file,max=1800,q=.78){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{bmp=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=URL.createObjectURL(file)})}
 const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(b=>r(b&&b.size<file.size?b:file),'image/jpeg',q))}

function events(all){const out=[],ok=p=>all||inScope(p);
 D.docs.forEach(d=>{if(d.expires&&ok(d.profileId))out.push({key:'doc:'+d.id,title:'Caduca: '+d.title,date:d.expires,pid:d.profileId,alertDays:d.alert||30,src:'doc',id:d.id,desc:`${d.cat}${d.number?' · '+d.number:''}`})});
 D.assets.forEach(a=>{if(!ok(a.profileId))return;[['itv','ITV'],['seguro','Seguro']].forEach(([k,l])=>{if(a[k])out.push({key:`veh:${a.id}:${k}`,title:`${l} · ${a.name}`,date:a[k],pid:a.profileId,alertDays:30,src:'veh',id:a.id,desc:a.plate||''})})});
 D.tasks.forEach(t=>{if(!t.done&&t.date&&ok(t.profileId))out.push({key:'task:'+t.id,title:t.title,date:t.date,pid:t.profileId,alertDays:t.alert||15,src:'task',id:t.id,desc:t.note||''})});
 return out.sort((a,b)=>a.date.localeCompare(b.date))}
function buildICS(list){const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Navaja Suiza//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
 list.forEach(ev=>{const ds=ev.date.replace(/-/g,''),nx=addD(ev.date,1).replace(/-/g,'');
  L.push('BEGIN:VEVENT',`UID:${ev.key.replace(/[^\w:-]/g,'')}-${ds}@navajasuiza`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${ds}`,`DTEND;VALUE=DATE:${nx}`,`SUMMARY:${e(ev.title)}`);
  if(ev.desc)L.push(`DESCRIPTION:${e(ev.desc)}`);
  [ev.alertDays,0].forEach(n=>{const h=n*24-9;L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${e(ev.title)}`,`TRIGGER:${h>0?'-':''}PT${Math.abs(h)}H`,'END:VALARM')});
  L.push('END:VEVENT')});
 L.push('END:VCALENDAR');return L.join('\r\n')}
async function scheduleNext(base,from,months,kmEvery,kmNow,kmYear){
 for(const t of D.tasks.filter(t=>!t.done&&t.kind===base.kind&&t.title===base.title&&t.profileId===base.profileId&&t.assetId===base.assetId)){t.done=true;t.doneDate=from;await save('tasks',t)}
 if(!months&&!kmEvery)return null;
 let date=null;if(months)date=addM(from,months);else if(kmYear)date=addM(from,Math.max(1,Math.round(kmEvery/kmYear*12)));
 const t={alert:15,...base,id:uid(),date,km:kmEvery?(kmNow||0)+kmEvery:null,months:months||0,kmEvery:kmEvery||0,done:false};await save('tasks',t);return t}

function tempChart(tp){if(!tp.length)return '';const s=[...tp].sort((a,b)=>a.t.localeCompare(b.t)),W=320,H=150,pl=30,pr=10,pt=10,pb=22,vs=s.map(x=>x.v);
 const lo=Math.floor(Math.min(36,...vs)-.5),hi=Math.ceil(Math.max(39,...vs)+.5),t0=new Date(s[0].t).getTime(),t1=new Date(s[s.length-1].t).getTime();
 const X=t=>t1===t0?pl+(W-pl-pr)/2:pl+(new Date(t).getTime()-t0)/(t1-t0)*(W-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 let g='';for(let v=lo;v<=hi;v++)g+=`<line class="g" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-5}" y="${Y(v)+3}" text-anchor="end">${v}</text>`;
 g+=`<line class="f" x1="${pl}" x2="${W-pr}" y1="${Y(38)}" y2="${Y(38)}"/>`;const dd=t=>new Date(t).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;padding:8px 8px 0">${g}<polyline class="ln" points="${s.map(x=>X(x.t)+','+Y(x.v)).join(' ')}"/>${s.map(x=>`<circle cx="${X(x.t)}" cy="${Y(x.v)}" r="3.5"/>`).join('')}<text x="${pl}" y="${H-6}">${dd(s[0].t)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${dd(s[s.length-1].t)}</text></svg>`}

 <div class="sec-t">Seguridad</div><div class="group"><button class="row" data-act="toggleBio"><span class="grow">Face ID / Touch ID</span><span class="l2">${LOCK?.cred?'Activado':'Desactivado'}</span></button><button class="row link" data-act="chgPin">Cambiar código</button><label class="row"><span class="grow">Bloqueo automático</span><select class="l2" style="border:0;background:none;font:inherit;color:var(--l2)" data-change="auto">${[[0,'Inmediato'],[60,'Tras 1 min'],[300,'Tras 5 min']].map(([v,l])=>`<option value="${v}" ${(LOCK?.auto??60)==v?'selected':''}>${l}</option>`).join('')}</select></label><button class="row link" data-act="lockNow">Bloquear ahora</button></div>

 <p class="cap-note">iOS no permite programar avisos locales sin servidor. La app marca con una insignia roja lo que está por vencer cuando la abres; para recordatorios fiables usa «Añadir a Apple Calendar (.ics)».</p>
 <div class="sec-t">Copia de seguridad</div><div class="group"><button class="row link" data-act="exportAll">Exportar copia completa (.json)</button><label class="row link"><span class="grow">Importar copia</span><input type="file" accept="application/json,.json" hidden data-change="importFile"></label></div>

/* ============ Bloqueo, PIN y biometría ============ */
const LK={mode:'unlock',buf:'',tmp:'',len:6,fails:0,until:0,msg:''};
const curLen=()=>LOCK&&LK.mode==='unlock'?LOCK.len:LK.len;
async function hashPin(pin,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=0;for(const c of salt+pin)h=(Math.imul(31,h)+c.charCodeAt(0))|0;return 'f'+h}}
function showLock(mode){LK.mode=mode;LK.buf='';LK.msg='';$('#lock').classList.add('on');document.body.classList.add('locked');drawLock()}
function drawLock(){const len=curLen(),bio=LK.mode==='unlock'&&LOCK?.cred&&window.PublicKeyCredential;
 const T={setup1:'Crea tu código de acceso',setup2:'Repite el código',unlock:'MultiCule'}[LK.mode],sub=LK.msg||{setup1:'Elige 4 o 6 dígitos. Es el respaldo si falla Face ID.',setup2:'Introdúcelo otra vez para confirmar.',unlock:'Introduce tu código'}[LK.mode];
 $('#lock').innerHTML=`<div class="lkic">${I('lock')}</div><h2>${T}</h2><p>${esc(sub)}</p>${LK.mode==='setup1'&&!LK.buf?`<div class="seg" style="width:180px">${[4,6].map(n=>`<button class="${LK.len===n?'on':''}" data-act="lkLen" data-v="${n}">${n} dígitos</button>`).join('')}</div>`:'<div style="height:50px"></div>'}<div class="dots" id="dots">${Array.from({length:len},(_,i)=>`<i class="${i<LK.buf.length?'f':''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="key" data-v="${n}">${n}</button>`).join('')}${bio?'<button class="ghost" data-act="bio">Face ID</button>':'<span></span>'}<button data-act="key" data-v="0">0</button><button class="ghost" data-act="key" data-v="del" aria-label="Borrar">${I('back')}</button></div>`}
function shake(msg){LK.msg=msg;LK.buf='';drawLock();const d=$('#dots');d&&d.classList.add('shake')}
function unlockApp(){LK.buf='';LK.msg='';$('#lock').classList.remove('on');document.body.classList.remove('locked');render();notifyDue()}
function lockNow(){if(!LOCK)return;while(SH.length)closeSheet();closeMenu();showLock('unlock')}
async function finishSetup(pin){const salt=uid();LOCK={salt,hash:await hashPin(pin,salt),len:LK.len,cred:null,auto:60};await setMeta('lock',LOCK);
 if(window.PublicKeyCredential&&confirm('¿Quieres desbloquear la app con Face ID / Touch ID? El código seguirá como respaldo.')){try{await enableBio()}catch(e){toast('No se pudo activar. Puedes hacerlo en Ajustes.')}}unlockApp()}
async function enableBio(){if(!window.PublicKeyCredential||!navigator.credentials)throw new Error('no');
 const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Navaja Suiza'},user:{id:rnd(16),name:'navaja-suiza',displayName:'Navaja Suiza'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
 LOCK.cred=b64u(new Uint8Array(c.rawId));await setMeta('lock',LOCK)}
async function bioUnlock(){if(!LOCK?.cred)return;try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:ub64u(LOCK.cred),transports:['internal']}],userVerification:'required',timeout:60000}});unlockApp()}catch(e){}}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();document.body.classList.add('cover')}else{document.body.classList.remove('cover');if(LOCK&&!$('#lock').classList.contains('on')&&Date.now()-hiddenAt>=(LOCK.auto??60)*1000)lockNow()}});

 let nx=null;if(t.months||t.kmEvery){const base=t.kind==='hogar'&&/Suscripción|Seguro/.test(t.type||'')&&t.date?t.date:today();nx=await scheduleNext({assetId:t.assetId,profileId:t.profileId,kind:t.kind,title:t.title,type:t.type,amount:t.amount,alert:t.alert},base,t.months,t.kmEvery,a?.km||0,a?.kmYear)}

A.lockNow=lockNow;A.bio=bioUnlock;
A.lkLen=d=>{LK.len=+d.v;drawLock()};
A.key=async d=>{if(Date.now()<LK.until)return;if(d.v==='del')LK.buf=LK.buf.slice(0,-1);else if(LK.buf.length<curLen())LK.buf+=d.v;LK.msg='';
 if(LK.buf.length<curLen()){drawLock();return}
 drawLock();const pin=LK.buf;
 if(LK.mode==='setup1'){LK.tmp=pin;setTimeout(()=>{LK.buf='';LK.mode='setup2';drawLock()},140)}
 else if(LK.mode==='setup2'){if(pin===LK.tmp)await finishSetup(pin);else setTimeout(()=>{LK.mode='setup1';shake('No coinciden. Empieza de nuevo.')},140)}
 else{if(await hashPin(pin,LOCK.salt)===LOCK.hash){LK.fails=0;unlockApp()}else{LK.fails++;if(LK.fails>=5){LK.until=Date.now()+30000;LK.fails=0;shake('Demasiados intentos. Espera 30 s.')}else shake('Código incorrecto')}}};

/* ============ Cule: ayudante local (sin internet) ============ */
const CHAT=[{b:1,h:'¡Ssssalud! Soy Cule 🐍. Pregúntame fechas o datos («¿cuándo caduca el DNI?», «próxima ITV»), pídeme que busque algo («busca el seguro del coche») o dime «anota …» o «recuérdame … el 25/12».'}];
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const STOP=new Set('de del la el los las un una y o a en que cuando cuanto cual es mi mis tu su por para con me te se al lo busca buscame dime dame muestrame caduca vence vencimiento proxima proximo fecha numero tengo hay ver'.split(' '));
const toks=q=>norm(q).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>1&&!STOP.has(w));
function parseDate(q){const n=norm(q);let m;if(/\bhoy\b/.test(n))return today();if(/\bmanana\b/.test(n))return addD(today(),1);
 if(m=n.match(/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/)){let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;const f=yy=>`${yy}-${pad(+m[2])}-${pad(+m[1])}`;return !m[3]&&f(y)<today()?f(y+1):f(y)}return null}
async function cule(q){const n=norm(q),t=toks(q),sc=s=>t.reduce((a,w)=>a+(norm(s).includes(w)?1:0),0);let m;
 const row=(a,id,ic,tt,sub)=>`<button class="row" data-act="${a}" data-id="${id}"><span class="ic">${ic}</span><span class="grow"><b>${esc(tt)}</b><small>${esc(sub)}</small></span><i class="chev">${I('chev')}</i></button>`;
 if(m=q.match(/^\s*(anota|apunta|nota)\b[:,]?\s*(.+)/is)){const x=m[2].trim();await save('records',{id:uid(),group:'nota',profileId:defPid(),type:x.slice(0,40),note:x,date:today()});return `Anotado 📝 «${esc(x)}». Lo tienes en Salud → Historial → Notas.`}
 if(/^\s*recuerda(me)?\b/.test(n)){const d=parseDate(q);if(!d)return 'Dime también la fecha, por ejemplo: «recuérdame renovar el pasaporte el 25/12».';
  const title=q.replace(/^\s*recu[eé]rda(me)?\s*/i,'').replace(/\s*(el\s+)?\d{1,2}[\/\-.]\d{1,2}([\/\-.]\d{2,4})?/,'').replace(/\b(hoy|mañana|manana)\b/i,'').trim()||'Recordatorio';
  await save('tasks',{id:uid(),kind:'otro',profileId:defPid(),title,date:d,months:0,alert:7,done:false});return `Hecho: «${esc(title)}» el ${fmt(d)} 📅. Ya sale en el Calendario.`}
 if(/guardar todo|copia de seguridad|backup/.test(n))return 'Pulsa y elige dónde guardarla:<button class="btn" data-act="exportAll" style="margin:8px 0 0;width:100%">💾 Guardar todo</button>';
 if(/\bnotas\b/.test(n)){const l=D.records.filter(r=>r.group==='nota').sort(byDate).slice(0,6);return l.length?`Tus últimas notas:<div class="group">${l.map(r=>row('openRec',r.id,'📝',r.type,fmt(r.date))).join('')}</div>`:'Aún no tienes notas. Dime «anota …».'}
 if(/cuando|vence|caduca|proxim|toca|pendiente|que hay|semana|este mes/.test(n)){const ev=events(true);
  const l=(t.length?ev.filter(e=>sc(`${e.title} ${pname(e.pid)} ${e.desc||''}`)>0).sort((a,b)=>sc(`${b.title} ${b.desc}`)-sc(`${a.title} ${a.desc}`)||a.date.localeCompare(b.date)):ev.filter(e=>days(e.date)<=(/semana/.test(n)?7:/mes/.test(n)?31:60))).slice(0,5);
  if(!l.length)return t.length?'No encuentro ningún vencimiento con eso. ¿Está añadido con fecha en la app?':'No hay nada próximo. ¡Todo al día! 🎉';
  return `${t.length?`${esc(l[0].title)}: <b>${fmt(l[0].date)}</b> (${statTxt(l[0].date)}).`:'Esto es lo próximo:'}<div class="group">${l.map(evRow).join('')}</div>`}
 if(!t.length)return 'Dime qué buscar, por ejemplo «seguro coche», o pregúntame «¿qué vence este mes?».';
 const it=[];D.docs.forEach(d=>it.push([`${d.title} ${d.cat} ${d.number||''} ${pname(d.profileId)}`,row('openDoc',d.id,CATEMO[d.cat]||'📄',d.title,`${d.cat}${d.number?' · nº '+d.number:''}${d.expires?' · caduca '+fmt(d.expires):''}`),d]));
 D.assets.forEach(a=>it.push([`${a.name} ${a.plate||''} ${a.seguroCia||''}`,row('openVeh',a.id,'🚗',a.name,`${a.plate||''} · ITV ${fmt(a.itv)} · seguro ${fmt(a.seguro)}`)]));
 D.profiles.filter(p=>p.type==='pet').forEach(p=>it.push([`${p.name} ${p.chip||''} ${p.species||''} ${p.cartilla||''} mascota`,row('openPet',p.id,'🐾',p.name,`${p.species||'Mascota'}${p.chip?' · chip '+p.chip:''}`)]));
 D.records.forEach(r=>it.push([`${r.type} ${r.note||''} ${r.markers||''} ${pname(r.profileId)} ${r.group}`,row('openRec',r.id,GI[r.group]||'📄',r.type||'Peso',recSub(r))]));
 D.episodes.forEach(e=>it.push([`${e.cause} ${pname(e.profileId)} ${(e.syms||[]).join(' ')}`,row('openEp',e.id,'🌡️',e.cause,`${fmtDT(e.start)}${e.end?' · duró '+dur(e.start,e.end):' · en curso'}`)]));
 D.tasks.filter(x=>!x.done).forEach(x=>it.push([`${x.title} ${x.type||''}`,row('openTask',x.id,'📅',x.title,x.date?fmt(x.date):'')]));
 const res=it.map(i=>[sc(i[0]),i]).filter(r=>r[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,6).map(r=>r[1]);
 if(!res.length)return `No he encontrado nada con «${esc(q)}». Prueba con otra palabra.`;
 const top=res[0][2];const num=/numero|n[º°o]\b/.test(n)&&top&&top.number?`El número de ${esc(top.title)} es <b>${esc(top.number)}</b>.<br>`:'';
 return `${num}${res.length===1?'Esto es lo que he encontrado:':`He encontrado ${res.length} cosas:`}<div class="group">${res.map(r=>r[1]).join('')}</div>`}
A.cule=()=>openSheet({title:'Cule 🐍',render:()=>`${CHAT.map(m=>`<div class="bub ${m.b?'b':'u'}">${m.h}</div>`).join('')}<form class="group" data-submit="culeAsk" style="margin-top:16px"><label class="fr"><input name="q" placeholder="Pregúntale a Cule…" autocomplete="off" style="text-align:left" required></label><button class="row link bold" type="submit">Enviar</button></form>`,mount:s=>{const c=$('.shc',s.el);c.scrollTop=c.scrollHeight}});
SB.culeAsk=async fd=>{const q=fd.q.trim();if(!q)return;CHAT.push({h:esc(q)});let h;try{h=await cule(q)}catch(e){console.error(e);h='Uy, me he liado. Prueba de otra forma.'}CHAT.push({b:1,h});refresh();const s=SH[SH.length-1];if(s)paint(s)};

 const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();Promise.resolve(fn(el.dataset,el)).catch(err=>{console.error(err);toast('Algo ha fallado. Inténtalo de nuevo.')})}});

/* ============ Notificaciones al abrir ============ */
async function notifyDue(){if(!('Notification' in window)||Notification.permission!=='granted')return;const seen=(await getMeta('seen'))||{},t=today();
 for(const e of events(true).filter(e=>days(e.date)<=e.alertDays&&seen[e.key]!==t).slice(0,5)){try{new Notification('MultiCule',{body:`${e.title} · ${statTxt(e.date)}`});seen[e.key]=t}catch{break}}
 await setMeta('seen',seen)}

function appIcon(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#8b5cf6');g.addColorStop(1,'#2e1065');x.fillStyle=g;x.fillRect(0,0,180,180);
 x.lineCap=x.lineJoin='round';x.strokeStyle='#2cf27a';x.lineWidth=24;x.beginPath();x.moveTo(34,150);x.bezierCurveTo(34,108,134,128,134,92);x.bezierCurveTo(134,60,70,76,92,52);x.stroke();
 const dot=(a,b,r,f)=>{x.fillStyle=f;x.beginPath();x.arc(a,b,r,0,7);x.fill()};dot(94,44,24,'#2cf27a');dot(85,38,7,'#fff');dot(103,38,7,'#fff');dot(86,39,3.5,'#111');dot(104,39,3.5,'#111');
 x.strokeStyle='#ff4d6d';x.lineWidth=4;x.beginPath();x.moveTo(94,66);x.lineTo(94,78);x.moveTo(94,78);x.lineTo(88,86);x.moveTo(94,78);x.lineTo(100,86);x.stroke();
 x.strokeStyle='#fff';x.lineWidth=9;x.beginPath();x.moveTo(128,148);x.lineTo(139,159);x.lineTo(158,134);x.stroke();
 const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.append(l);const f=document.createElement('link');f.rel='icon';f.href=l.href;document.head.append(f)}

 appIcon();
 try{await DB.open()}catch(e){document.body.innerHTML='<p style="padding:40px;font:17px -apple-system,sans-serif">No se pudo abrir la base de datos local. Abre la app en Safari fuera del modo privado.</p>';return}

 try{navigator.storage?.persist?.()}catch{}
